# Google basic (no-JS) layout, as Oxylabs returned it for a UK desktop request
# on 2026-10-01: no #rso, #center_col, MjjYud, schema itemtype or body srp
# class. Organics are div.Gx5Zad cards under div#main, titles an h3 inside a
# /url?q= redirect link (see src/Parser/Evaluated/BasicLayout.php).
#
# The page carries a viewport meta, so GoogleSerp::isMobile() routes it to
# MobileNaturalParser; ClassicalResultBasic sits in both parsers and emits
# CLASSICAL_MOBILE there. Cards that are NOT organic on this page: the AI
# Overview card, the Places card (two h3), two "People also search for"
# cards, the footer. Inline sitelinks ("What is invoice finance? · ...") are
# emitted as SITE_LINKS_SMALL right after their organic; the AI Overview card
# (10 citations behind "Show more", injected from its jsl.dh payload), the
# Places card (2 listings) and the two "People also search for" cards (merged
# into one RELATED_SEARCHES item, emitted last) are the page's features.
url: https://www.google.co.uk/search?q=invoice+factoring&hl=en-gb&gl=gb
file: test/resources/pages-basic/invoice-factoring-uk-p1.html

